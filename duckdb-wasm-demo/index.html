<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuckDB WASM Demo</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>DuckDB WASM Demo</h1>
      <div id="status-bar">
        <span id="init-status">Initializing...</span>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="editor">SQL Editor</button>
      <button class="tab" data-tab="dashboard">Dashboard</button>
    </nav>

    <main>
      <div id="tab-editor" class="tab-content active">
        <section class="data-section">
          <h2>Data</h2>
          <div class="data-actions">
            <button id="btn-load-sample" disabled>Load Sample Data</button>
            <div id="drop-zone" class="drop-zone">
              <p>Drop CSV/Parquet here or <label for="file-input" class="file-label">browse</label></p>
              <input type="file" id="file-input" accept=".csv,.parquet,.parq" hidden />
            </div>
          </div>
          <div id="table-list"></div>
        </section>

        <section class="query-section">
          <h2>SQL Query</h2>
          <div class="preset-queries">
            <button class="preset" data-sql="SELECT * FROM sales LIMIT 20">All rows</button>
            <button class="preset" data-sql="SELECT category, SUM(amount) as total, COUNT(*) as cnt FROM sales GROUP BY category ORDER BY total DESC">By category</button>
            <button class="preset" data-sql="SELECT date, SUM(amount) as daily_total FROM sales GROUP BY date ORDER BY date">Daily sales</button>
            <button class="preset" data-sql="SELECT COALESCE(category, '== Total ==') as category, SUM(amount) as total FROM sales GROUP BY ROLLUP(category) ORDER BY GROUPING(category), total DESC">ROLLUP</button>
          </div>
          <textarea id="sql-input" rows="6" placeholder="Enter SQL query..." disabled></textarea>
          <div class="query-actions">
            <button id="btn-execute" disabled>Execute (Ctrl+Enter)</button>
            <span id="query-stats"></span>
          </div>
        </section>

        <section id="result-section" class="result-section" hidden>
          <h2>Results <span id="result-count"></span></h2>
          <div id="result-table" class="table-wrapper"></div>
        </section>
      </div>

      <div id="tab-dashboard" class="tab-content">
        <div id="dashboard-content">
          <p class="placeholder-message">Load sample data first to see the dashboard.</p>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
